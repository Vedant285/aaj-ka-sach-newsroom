name: Gemini API check

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: gemini-connection-check
  cancel-in-progress: false

jobs:
  connection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check Gemini with one small request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';

          const key = process.env.GEMINI_API_KEY ?? '';
          const model = process.env.GEMINI_MODEL ?? '';
          const report = { result: 'failed', model, httpStatus: null };
          const redact = (value) => {
            let text = String(value ?? '');
            for (const secret of [key, key.trim(), encodeURIComponent(key)].filter(Boolean)) {
              text = text.replaceAll(secret, '[redacted]');
            }
            return text.replace(/AIza[A-Za-z0-9_-]+/g, '[redacted]')
              .replace(/https?:\/\/[^\s"<>]+/g, '[URL omitted]')
              .replace(/[\u0000-\u001f\u007f]/g, ' ').slice(0, 1000);
          };

          try {
            if (!key.trim()) throw new Error('Missing repository secret GEMINI_API_KEY.');
            if (key !== key.trim()) throw new Error('GEMINI_API_KEY contains surrounding whitespace. Save only the key.');
            if (!/^[a-zA-Z0-9._-]+$/.test(model)) {
              throw new Error('Set GEMINI_MODEL to the exact model ID without models/, quotes, or spaces.');
            }

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
              method: 'POST', redirect: 'error', signal: AbortSignal.timeout(60000),
              headers: { 'x-goog-api-key': key, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ role: 'user', parts: [{ text: 'Return only this JSON object: {"ok":true}' }] }],
                generationConfig: { responseMimeType: 'application/json', maxOutputTokens: 2048 },
              }),
            });
            report.httpStatus = response.status;
            const chunks = [];
            let size = 0;
            for await (const chunk of response.body ?? []) {
              size += chunk.length;
              if (size > 262144) throw new Error('API response exceeded the diagnostic size limit.');
              chunks.push(chunk);
            }
            let data;
            try { data = JSON.parse(Buffer.concat(chunks).toString('utf8')); }
            catch { throw new Error(`HTTP ${response.status}: API returned a non-JSON response; raw body withheld.`); }

            if (!response.ok) {
              report.apiStatus = redact(data.error?.status ?? 'not provided');
              report.message = redact(data.error?.message ?? 'No error message supplied.');
              report.nextStep = ({
                400: 'Read the API message: check key validity, model options, and regional availability.',
                401: 'Check the API key and project authentication.',
                403: 'Check API key restrictions, project permissions, and the API message.',
                404: 'Check that the exact model ID supports generateContent for this project.',
                429: 'Check this model/project quota in AI Studio. Do not repeatedly rerun.',
                500: 'Retry later; inspect the API message if the failure persists.',
                503: 'Even this short request is unavailable. Retry later or choose another model with verified free-tier access.',
              })[response.status] ?? 'Inspect the sanitized API message.';
              process.exitCode = 1;
            } else {
              const candidate = data.candidates?.[0];
              report.finishReason = redact(candidate?.finishReason ?? 'not provided');
              const text = (candidate?.content?.parts ?? []).filter((part) => !part.thought).map((part) => part.text ?? '').join('');
              let output;
              try { output = JSON.parse(text); } catch { output = null; }
              if (candidate?.finishReason === 'STOP' && output?.ok === true) {
                report.result = 'passed';
                report.message = 'The configured key and model completed a small JSON request. No news was generated or published.';
                report.nextStep = 'Retry the one-article dry-run. Success here does not guarantee capacity for the larger news request.';
              } else {
                report.message = 'HTTP succeeded, but the model did not complete the requested JSON response. Generated content withheld.';
                report.nextStep = 'Check finishReason and model JSON-output support; this is not an HTTP 503 failure.';
                process.exitCode = 1;
              }
            }
          } catch (error) {
            report.message = error.name === 'TimeoutError'
              ? 'Request timed out after 60 seconds. No automatic retry was made.'
              : error instanceof TypeError
                ? 'Network or redirect failure. No automatic retry was made.'
                : redact(error.message);
            process.exitCode = 1;
          }

          for (const [field, value] of Object.entries(report)) {
            if (typeof value === 'string') report[field] = redact(value);
          }
          console.log(`Gemini diagnostic: ${JSON.stringify(report)}`);
          if (process.env.GITHUB_STEP_SUMMARY) {
            const summary = JSON.stringify(report, null, 2).replace(/`/g, '\\u0060').replace(/</g, '\\u003c');
            await appendFile(process.env.GITHUB_STEP_SUMMARY, `# Gemini API check\n\nOne small request at most; no retries, news feeds, or Sanity access.\n\n\`\`\`json\n${summary}\n\`\`\`\n`);
          }
          NODE
